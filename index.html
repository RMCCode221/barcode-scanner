<!DOCTYPE html>
<html>
<head>
    <title>Scanner Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #f0f2f5; }
        #scanner { width: 100%; height: 250px; background: #000; border-radius: 12px; overflow: hidden; }
        #indicator { margin: 15px 0; padding: 20px; font-weight: bold; background: white; border-radius: 10px; border: 2px solid #ddd; min-height: 30px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 20px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        .btn-1 { background: #2e7d32; } .btn-2 { background: #1565c0; }
        #history { margin-top: 15px; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>    
<div id="scanner"></div>
<div id="indicator">READY TO SCAN</div>

<button id="check-btn" onclick="runNetworkTask('check')" style="width:100%; padding:15px; background:#607d8b; color:white; border:none; border-radius:10px; margin-bottom:10px; font-weight:bold;">
    CHECK MEMBER STATUS
</button>

<div class="btn-group">
    <button id="btn-1" class="btn-1" onclick="runNetworkTask('submit', 1)">SELECT 1</button>
    <button id="btn-2" class="btn-2" onclick="growl('submit', 2)">SELECT 2</button> </div>
<div id="history"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyR-WuV0pLtvHmMFW4ZiUriYGAxqS_buV3nngwVt8epj7MaBNep7JqiPgFYGplAmMTr/exec";
    let currentCode = null;

    // ... (Keep your Quagga.init and onDetected from the working version) ...

    function runNetworkTask(mode, val = 0) {
        if (!currentCode) return alert("Scan barcode first!");
        
        const ind = document.getElementById('indicator');
        ind.innerText = mode === 'check' ? "CHECKING..." : "SAVING...";
        
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?barcode=${currentCode}&selection=${val}&mode=${mode}&callback=handleResponse`;
        document.body.appendChild(script);
    }

    window.handleResponse = function(res) {
        const ind = document.getElementById('indicator');
        const hist = document.getElementById('history');
        const b1 = document.getElementById('btn-1');
        const b2 = document.getElementById('btn-2');
        
        // Reset buttons first
        b1.disabled = false; b2.disabled = false;
        b1.style.opacity = "1"; b2.style.opacity = "1";

        let color = "white";
        let text = "";

        if (res.total >= 2) {
            color = "#F44336"; // RED
            text = "LIMIT REACHED (" + res.total + ")";
            // BLOCK BUTTONS
            b1.disabled = true; b2.disabled = true;
            b1.style.opacity = "0.3"; b2.style.opacity = "0.3";
        } else if (res.total === 1) {
            color = "#FFEB3B"; // YELLOW
            text = "1 PURCHASE FOUND";
            // BLOCK "SELECT 2" because 1+2 = 3 (Over limit)
            b2.disabled = true;
            b2.style.opacity = "0.3";
        } else {
            color = "#4CAF50"; // GREEN
            text = "CLEAN: 0 PURCHASES";
        }

        ind.style.background = color;
        ind.innerText = text;
        hist.innerHTML = res.lastTime ? `Last activity: ${res.lastTime}` : "No history found.";

        // If it was a 'check', don't clear the code so they can still click a Select button
        if (res.mode === 'submit') {
            setTimeout(() => {
                ind.style.background = "white";
                ind.innerText = "READY TO SCAN";
                currentCode = null;
            }, 3000);
        }
    };
</script>
</body>
</html>
