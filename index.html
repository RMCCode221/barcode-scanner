<!DOCTYPE html>
<html>
<head>
    <title>Scanner Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #f0f2f5; }
        #scanner { width: 100%; height: 250px; background: #000; border-radius: 12px; overflow: hidden; }
        #indicator { margin: 15px 0; padding: 20px; font-weight: bold; background: white; border-radius: 10px; border: 2px solid #ddd; min-height: 30px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 20px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        .btn-1 { background: #2e7d32; } .btn-2 { background: #1565c0; }
        #history { margin-top: 15px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div id="scanner"></div>
    <div id="indicator">READY TO SCAN</div>
    <div class="btn-group">
        <button class="btn-1" onclick="submit(1)">SELECT 1</button>
        <button class="btn-2" onclick="submit(2)">SELECT 2</button>
    </div>
    <div id="history"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVd0S_vxnHP827AH_UKtU2ADssJXwkijYmgQ3YomhthUC-cx_Uve00kReyWc4rfLIgKw/exec"; // Ensure this is your NEW Deployment URL
    let currentCode = null;

    // Initialize Camera
    Quagga.init({
        inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#scanner'), constraints: { facingMode: "environment" } },
        decoder: { readers: ["code_128_reader", "ean_reader", "upc_reader"] }
    }, (err) => { if (!err) Quagga.start(); });

    Quagga.onDetected(data => {
        currentCode = data.codeResult.code;
        const displayCode = currentCode.slice(0, -1);
        document.getElementById('indicator').innerText = "SCANNED: " + displayCode;
        document.getElementById('indicator').style.background = "#e3f2fd";
        // Play beep if you still have that function
    });

    function submit(val) {
        if (!currentCode) return alert("Scan something first!");
        
        const ind = document.getElementById('indicator');
        ind.innerText = "CHECKING DATABASE...";
        ind.style.background = "#eee";

        // JSONP Request to bypass CORS blocks
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?barcode=${currentCode}&selection=${val}&callback=handleResponse`;
        document.body.appendChild(script);
    }

    // THIS HANDLES THE INDICATORS YOU REQUESTED
    window.handleResponse = function(res) {
        const ind = document.getElementById('indicator');
        const hist = document.getElementById('history');
        let color = "white";
        let text = "";

        if (res.isNew) {
            color = "#4CAF50"; // GREEN
            text = "NEW SCAN SAVED";
            hist.innerHTML = "";
        } else {
            if (res.prevSel == 1) {
                color = "#FFEB3B"; // YELLOW
                text = "ALREADY SCANNED (1)";
            } else {
                color = "#F44336"; // RED
                text = "ALREADY SCANNED (2)";
            }
            hist.innerHTML = `<strong>Last Scan:</strong> ${res.prevTime}<br><strong>Prev Selection:</strong> ${res.prevSel}`;
        }

        ind.style.background = color;
        ind.innerText = text;

        // Reset to white after 3 seconds
        setTimeout(() => {
            ind.style.background = "white";
            ind.innerText = "READY TO SCAN";
            currentCode = null; // Clear code so you can scan the next one
        }, 3000);
    };
</script>
</body>
</html>
