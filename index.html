<body>
    <div id="setup-screen" style="padding: 50px 20px;">
        <button id="activate-btn" onclick="initScanner()" style="background: #673ab7; padding: 30px; width: 100%; font-size: 1.5rem; color: white; border-radius: 15px; border: none; font-weight: bold;">
            ACTIVATE SCANNER
        </button>
        <p style="margin-top: 15px; color: #666;">Tap to enable camera & audio</p>
    </div>

    <div id="scanner-container" style="display:none;">
        <div id="scanner" style="width: 100%; height: 250px; background: #000; border-radius: 12px; overflow: hidden;"></div>
        <div id="indicator" style="margin: 15px 0; padding: 20px; font-weight: bold; background: white; border-radius: 10px; border: 2px solid #ddd; min-height: 30px;">READY</div>
        
        <div class="btn-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="submit(1)" style="background: #2e7d32; padding: 20px; border: none; border-radius: 10px; color: white; font-weight: bold;">SELECT 1</button>
            <button onclick="submit(2)" style="background: #1565c0; padding: 20px; border: none; border-radius: 10px; color: white; font-weight: bold;">SELECT 2</button>
        </div>
        <div id="history" style="margin-top: 15px; font-size: 0.9rem; color: #444;"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlfXo0hJPstzPYoB513OitmPGSfjUdQLWcqvWs0hnU5f5_nEVxZoMvxwJjCYZ8zh9M/exec"; 
        let currentCode = null;

        function initScanner() {
            // Show scanner, hide start button
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'block';

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#scanner'),
                    constraints: {
                        facingMode: "environment" // Simple constraint
                    }
                },
                decoder: { readers: ["code_128_reader", "ean_reader", "upc_reader"] }
            }, function(err) {
                if (err) {
                    alert("Scanner Error: " + err.name);
                    return;
                }
                Quagga.start();
            });
        }

        Quagga.onDetected(data => {
            if (currentCode !== data.codeResult.code) {
                currentCode = data.codeResult.code;
                document.getElementById('indicator').innerText = "SCANNED: " + currentCode.slice(0, -1);
                document.getElementById('indicator').style.background = "#e3f2fd";
                // Optional: Play a short beep here
            }
        });

        function submit(val) {
            if (!currentCode) return alert("Scan a barcode first!");
            const ind = document.getElementById('indicator');
            ind.innerText = "CHECKING...";

            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?barcode=${currentCode}&selection=${val}&callback=handleResponse`;
            document.body.appendChild(script);
        }

        window.handleResponse = function(res) {
            const ind = document.getElementById('indicator');
            const hist = document.getElementById('history');
            
            if (res.newTotal > 2) {
                ind.style.background = "#F44336"; // RED
                ind.innerText = "LIMIT EXCEEDED (" + res.newTotal + ")";
                hist.innerHTML = `<b style="color:red">Already bought ${res.previousTotal}. Blocked.</b>`;
            } else if (res.previousTotal > 0) {
                ind.style.background = "#FFEB3B"; // YELLOW
                ind.innerText = "PREVIOUS: TOTAL " + res.newTotal;
                hist.innerHTML = `Last purchase: ${res.lastTime}`;
            } else {
                ind.style.background = "#4CAF50"; // GREEN
                ind.innerText = "NEW: SAVED (" + res.newTotal + "/2)";
                hist.innerHTML = "First time scanning this member.";
            }

            setTimeout(() => {
                ind.style.background = "white";
                ind.innerText = "READY";
                currentCode = null;
            }, 4000);
        };
    </script>
</body>
